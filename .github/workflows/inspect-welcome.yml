name: Apply welcome button fix
on:
  push:
    paths:
      - '.github/workflows/inspect-welcome.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire welcome actions script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./static/welcome-actions.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not locate </body> in index.html')
              s = s.replace(marker, '    ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: wire welcome screen buttons'
          git push
