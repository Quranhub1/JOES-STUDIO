name: Restore welcome buttons original wiring
on:
  push:
    paths:
      - '.github/workflows/restore-welcome-original.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore original welcome wiring
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('      window.App = App;\n', '', 1)
          s2 = s2.replace('    <script src="./static/welcome-actions.js"></script>\n', '', 1)
          if s2 == s:
              raise SystemExit('Expected welcome wiring changes were not found')
          p.write_text(s2, encoding='utf-8')
      - name: Remove temporary handler module
        run: rm -f static/welcome-actions.js
      - name: Commit source restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html static/welcome-actions.js
          git commit -m 'revert: restore original welcome button wiring'
          git push
