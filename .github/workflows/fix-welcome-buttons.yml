name: Fix welcome screen App scope

on:
  push:
    paths:
      - '.github/workflows/fix-welcome-buttons.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expose App to inline handlers
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '      };\n      window.onload = function () {'
          replacement = '      };\n      window.App = App;\n      window.onload = function () {'
          if 'window.App = App;' in s:
              print('App is already exposed.')
          elif marker in s:
              p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
              print('Patched index.html.')
          else:
              raise SystemExit('Could not locate App initialization boundary.')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: expose App for welcome screen buttons'
            git push
          fi
